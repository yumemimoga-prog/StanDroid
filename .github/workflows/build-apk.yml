name: Build APK

on:
  workflow_dispatch:
    inputs:
      coexist:
        description: "公式版と共存させる（別アプリとしてインストール）"
        type: boolean
        default: true
  push:
    branches: [ fix/nicolive-single-cookie ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "11"
          cache: gradle

      - name: Unit test & build debug APK
        run: |
          SUFFIX=""
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.coexist }}" = "true" ]; then
            SUFFIX="-PstandroidSuffix=.fix"
          fi
          set -o pipefail
          bash ./gradlew :app:testDebugUnitTest :app:assembleDebug $SUFFIX --console=plain 2>&1 | tee build.log || {
            grep -E -A4 "^e: |What went wrong|FAILED$|> Task .*FAILED" build.log | grep -v NumberFormat | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: StanDroid-debug-apk
          path: app/build/outputs/apk/debug/*.apk
